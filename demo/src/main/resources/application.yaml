spring:
  application:
    name: sloth
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sloth}
    username: ${DB_USER:sloth}
    password: ${DB_PASSWORD:sloth}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

sloth:
  allowed-origin: ${SLOTH_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
  videos:
    path: ${SLOTH_VIDEO_PATH:./data/videos}
